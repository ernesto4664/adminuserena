<mat-sidenav-container class="shell">

  <!-- SIDEBAR -->
  <mat-sidenav class="sidenav" mode="side" [opened]="true" [class.collapsed]="collapsed()">
    <div class="brand">
      <div class="logo">
        <img
          src="assets/images/logop.png"
          alt="Universidad de La Serena"
          class="logo-img"
          [class.collapsed]="collapsed()"
        />
      </div>
    </div>

    <mat-divider></mat-divider>

    <div class="nav-scroll">
      <mat-nav-list class="nav">

        <!-- INICIO (placeholder - no navega a nada por ahora) -->
        <a
          mat-list-item
          routerLink="/inicio"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle *ngIf="!collapsed()">Inicio</span>
        </a>

        <!-- ✅ OAME = dashboard (click navega). Flecha solo expande submenú -->
        <a
          mat-list-item
          routerLink="/oame/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="oame-root"
        >
          <mat-icon matListItemIcon>insights</mat-icon>
          <span matListItemTitle *ngIf="!collapsed()">OAME</span>

          <!-- Flecha (solo UI) -->
          <span class="spacer"></span>

          <button
            mat-icon-button
            class="subtoggle"
            *ngIf="!collapsed()"
            (click)="toggleOameSubmenu($event)"
            [attr.aria-label]="oameOpen() ? 'Cerrar menú OAME' : 'Abrir menú OAME'"
          >
            <mat-icon>{{ oameOpen() ? 'expand_less' : 'expand_more' }}</mat-icon>
          </button>
        </a>

        <!-- ✅ Submenú OAME (NO incluye Dashboard porque OAME ya lo abre) -->
        <div class="submenu" *ngIf="!collapsed() && oameOpen()">
          <a
            mat-list-item
            class="subitem"
            routerLink="/oame/riesgo"
            [queryParams]="{ semestre: oameSemestre() }"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <mat-icon matListItemIcon>warning_amber</mat-icon>
            <span matListItemTitle>Riesgo académico</span>
          </a>

          <a
            mat-list-item
            class="subitem"
            routerLink="/oame/alertas"
            [queryParams]="{ semestre: oameSemestre() }"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <mat-icon matListItemIcon>notifications</mat-icon>
            <span matListItemTitle>Alertas</span>
          </a>

          <a
            mat-list-item
            class="subitem"
            routerLink="/oame/acompanamientos"
            [queryParams]="{ semestre: oameSemestre() }"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <mat-icon matListItemIcon>handshake</mat-icon>
            <span matListItemTitle>Acompañamientos</span>
          </a>

          <a
            mat-list-item
            class="subitem"
            [routerLink]="['/oame/estudiantes']"
            [queryParams]="{ semestre: oameSemestre() }"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <mat-icon matListItemIcon>search</mat-icon>
            <span matListItemTitle>Rendimiento y parciales</span>
          </a>
        </div>

        <!-- placeholders para otros módulos -->
        <a mat-list-item class="disabled-link" (click)="$event.preventDefault()">
          <mat-icon matListItemIcon>domain</mat-icon>
          <span matListItemTitle *ngIf="!collapsed()">AGDDFI</span>
        </a>

        <a mat-list-item class="disabled-link" (click)="$event.preventDefault()">
          <mat-icon matListItemIcon>school</mat-icon>
          <span matListItemTitle *ngIf="!collapsed()">DGAE</span>
        </a>

        <a mat-list-item class="disabled-link" (click)="$event.preventDefault()">
          <mat-icon matListItemIcon>shield</mat-icon>
          <span matListItemTitle *ngIf="!collapsed()">UMD</span>
        </a>

      </mat-nav-list>
    </div>

    <div class="sidenav-footer" *ngIf="!collapsed()">
      <div class="small">AdminUSerena</div>
      <div class="small muted">v0.1</div>
    </div>
  </mat-sidenav>

  <!-- CONTENT -->
  <mat-sidenav-content class="content">

    <!-- HEADER -->
    <mat-toolbar class="topbar" color="primary">
      <button mat-icon-button (click)="toggleSidebar()">
        <!-- <mat-icon>menu</mat-icon>-->
      </button>

      <div class="crumb">
        <!-- ✅ dinámico -->
        <span class="crumb-title">{{ crumbTitle() }}</span>
      </div>

      <span class="spacer"></span>

      <button mat-icon-button [matBadge]="1" matBadgeColor="warn">
        <mat-icon>notifications</mat-icon>
      </button>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user">
        <div class="avatar">EV</div>
        <div class="user-text">
          <div class="name">[Nombre apellido]</div>
          <div class="role">[Unidad]</div>
        </div>
        <mat-icon>expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item>
          <mat-icon>person</mat-icon>
          <span>Perfil</span>
        </button>
        <button mat-menu-item>
          <mat-icon>logout</mat-icon>
          <span>Salir</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <!-- BODY -->
    <div class="oame-gob">
      <div class="router-wrap">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <div>Universidad de La Serena · AdminUSerena</div>
      <div class="muted">© {{ currentYear }}</div>
    </footer>

  </mat-sidenav-content>
</mat-sidenav-container>
