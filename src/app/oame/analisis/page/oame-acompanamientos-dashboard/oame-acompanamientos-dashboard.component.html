<div class="page">
  <div class="header">
    <div>
      <h1>OAME · Acompañamientos</h1>
      <p class="sub">Semestre: {{ semestre() }}</p>
    </div>

    <button mat-stroked-button (click)="volver()">
      <mat-icon>arrow_back</mat-icon>
      Volver
    </button>
  </div>

  <mat-card class="card">
    <mat-icon class="big">handshake</mat-icon>
    <div class="title">En construcción</div>
    <div class="desc">
      Aquí va el módulo de acompañamientos (estado, responsables, bitácora). Ruta lista para no frenar el cierre.
    </div>
  </mat-card>
</div>
